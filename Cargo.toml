[package]
name = "riscvc"
version = "0.2.0"
edition = "2024"
description = "Pure-Rust RV32IMF toolchain: MLIR llvm dialect => RV32 codegen, GNU assembler, linker, objdump, simulator; dialect / pass plugins"
license = "MIT AND Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/Jabberwocky238/riscvc"
readme = "README.md"
keywords = ["riscv", "compiler", "assembler", "linker", "mlir"]
categories = ["compilers", "development-tools"]
# fixture（31 MB）与对照脚本不进 crates.io 的包
exclude = ["tests/fixtures/", "tests/support/", "tools/", "target/"]

# 一个 feature = 一个编译选项 = 一个目标扩展（同 -march），default 开标准的 m、f。没开的扩展：汇编器不认、译码不认、
# 解释器陷入，代码生成改走 compiler-rt（乘除 libcall、软浮点）。组件（汇编器、链接器、代码生成 …）总在，不是 feature。
[features]
default = ["toolchain", "m", "f"]
# ⭐ 工具链本体（编译器、汇编器、链接器、反汇编、模拟器、命令行）。关掉（`default-features = false`）只剩 `riscvc::elf`：
# ELF32 小端 RISC-V 的读写模型，`no_std` + `alloc`，只依赖 thiserror。
toolchain = ["dep:riscvc-macros", "dep:clap", "dep:mlirformat", "dep:mlirpass", "dep:object", "dep:allocator-api2", "dep:bumpalo", "dep:hashbrown", "dep:log", "dep:rustc-hash", "dep:smallvec", "dep:xxhash-rust", "thiserror/std"]
# C：16 位压缩指令（汇编器、反汇编、解释器认 `c.*` 与 16 位编码；`-march` 带 c2p0_zca1p0[_zcf1p0]），默认不开
c = []
# M：乘除（蕴含 zmmul）；没开 ⇒ 除法 / 取余调 __divsi3 一类
m = ["zmmul"]
# Zmmul：只有乘法；没开 ⇒ 乘法调 __mulsi3
zmmul = []
# F：单精度浮点 + ilp32f 调用约定（蕴含 zicsr）；没开 ⇒ ilp32 + 软浮点
f = ["zicsr"]
# Zicsr：CSR 指令
zicsr = []
# 玄铁（T-Head）厂商扩展，默认不开（src/feature/xthead/）
xtheadba = []
xtheadbb = []
xtheadbs = []
xtheadcmo = []
xtheadcondmov = []
xtheadfmemidx = ["f"]
xtheadmac = []
xtheadmemidx = []
xtheadmempair = []
xtheadsync = []
# 玄铁的全部
xthead = ["xtheadba", "xtheadbb", "xtheadbs", "xtheadcmo", "xtheadcondmov", "xtheadfmemidx", "xtheadmac", "xtheadmemidx", "xtheadmempair", "xtheadsync"]

[lints.rust]
# src/alloc（内化的 regalloc2）里这三个 feature 是上游的，riscvc 不开也不声明；
# 在这里登记一下，省得它们刷出几百条 unexpected_cfgs。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("enable-serde", "trace-log", "fuzzing"))'] }

[workspace]
members = [".", "macros"]

[dependencies]
riscvc-macros = { path = "macros", version = "0.1.1", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
# ⭐ mlirformat 与 mlirpass 必须是同一份 mlirformat（Body ⇄ Module 在两边直接传），所以都走 path
mlirformat = { path = "../../../mlirformat.rs", version = "0.4.0", default-features = false, optional = true }
# 高层方言（func / arith / scf / cf / memref / math / index / affine …）下降成 llvm 方言
mlirpass = { path = "../../../mlirpass", version = "0.1.0", default-features = false, features = ["std"], optional = true }
object = { version = "0.37", default-features = false, features = ["write_std", "read_core", "elf", "std"], optional = true }
# ⭐ src/alloc（内化的 regalloc2）的依赖，版本照上游 Cargo.toml，⛔ 别擅自升
allocator-api2 = { version = "0.2.18", default-features = false, features = ["alloc"], optional = true }
bumpalo = { version = "3.16.0", features = ["allocator-api2"], optional = true }
hashbrown = { version = "0.17", default-features = false, optional = true }
log = { version = "0.4.8", default-features = false, optional = true }
rustc-hash = { version = "2.0.0", default-features = false, optional = true }
# 机器指令的寄存器表内联存放（src/alloc 也用它）
smallvec = { version = "1.6.1", features = ["union"], optional = true }
thiserror = { version = "2", default-features = false }
# SHF_MERGE 去重的分片哈希（同 lld：llvm::xxh3_64bits）
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }

[[bin]]
name = "riscvc"
path = "src/main.rs"
required-features = ["toolchain"]

# 实参按 ilp32f 放（float 进 fa 寄存器）
[[test]]
name = "llc_vs_llc"
required-features = ["f"]
