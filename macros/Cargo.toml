[package]
name = "riscvc-macros"
version = "0.1.2"
edition = "2024"
description = "Procedural macros for riscvc: instruction tables (#[derive(Isa)]) and the opcode union (#[derive(Opcode)])"
license = "MIT"
repository = "https://github.com/Jabberwocky238/riscvc"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
